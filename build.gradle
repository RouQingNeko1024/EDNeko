buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://jitpack.io/" }
        maven { url = "https://maven.aliyun.com/nexus/content/groups/public/" }
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    }
}

plugins {
    id "java"
    id "idea"
    id "org.jetbrains.kotlin.jvm"
    id "com.github.johnrengelman.shadow" version "6.1.0"
    id "net.minecraftforge.gradle.forge"
    id "org.spongepowered.mixin"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://jitpack.io/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://maven.aliyun.com/nexus/content/groups/public/" }
    maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    maven { url = "https://repo.huaweicloud.com/repository/maven/" }
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"
compileJava.options.compilerArgs.add("-Xlint:none")

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
            "-Xno-call-exceptions",
            "-Xno-param-assertions",
            "-Xno-receiver-assertions",
            "-Xopt-in=kotlin.RequiresOptIn",
            "-Xopt-in=kotlin.ExperimentalCoroutinesApi"
        ]
        suppressWarnings = [
            "UNCHECKED_CAST",
            "DEPRECATION",
            "UNUSED_PARAMETER",
            "UNUSED_EXPRESSION"
        ]
    }
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
    clientJvmArgs += ["-Dfml.coreMods.load=net.ccbluex.liquidbounce.injection.forge.MixinLoader", "-Xmx4096m", "-Xms1024m", "-Ddev-mode"]
}

configurations {
    runtimeOnly.canBeResolved = true
}

dependencies {
    implementation("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
        exclude module: "guava"
        exclude module: "commons-io"
        exclude module: "gson"
        exclude module: "launchwrapper"
        exclude module: "log4j-core"
        exclude module: "slf4j-api"
    }

    annotationProcessor("org.spongepowered:mixin:0.7.11-SNAPSHOT")


    implementation("com.github.CCBlueX:Elixir:1.2.6") {
        exclude module: "kotlin-stdlib"
        exclude module: "authlib"
    }

    implementation 'com.github.TheAltening:TheAltening4j:d0771f42d3'
    implementation 'com.github.TheAltening:API-Java-AuthLib:63a9702615'

    implementation("org.knowm.xchart:xchart:3.8.8")

    // HTTP Client
    implementation("com.squareup.okhttp3:okhttp:5.0.0-alpha.14") {
        exclude module: "kotlin-stdlib"
    }

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"

    // Swing LookAndFeel
    implementation "com.formdev:flatlaf:3.5.4"

    // JLayer and MP3SPI for MP3 playback
    implementation "javazoom:jlayer:1.0.1"
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"

    // jhlabs for image filtering (Gaussian blur)
    implementation "com.jhlabs:filters:2.0.235-1"

    implementation fileTree(include: ["*.jar"], dir: "libs")
}

shadowJar {
    archiveClassifier.set("")
    destinationDirectory.set(file("build/libs"))
    duplicatesStrategy DuplicatesStrategy.EXCLUDE

    exclude "LICENSE.txt"

    exclude "META-INF/maven/**"
    exclude "META-INF/versions/**"
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "META-INF/MANIFEST.MF"
    exclude "META-INF/module-info.class"
    exclude "module-info.class"

    exclude "org/apache/log4j/**"
    exclude "org/apache/commons/**"
    exclude "org/junit/**"

    exclude "com/google/**"
    exclude "com/sun/**"
    exclude "javax/**"

    exclude "org/intellij/**"
    exclude "org/jetbrains/annotations/**"

    exclude "*.html"
    exclude "*.md"
    exclude "*.txt"
    exclude "*.xml"
    exclude "META-INF/DEPENDENCIES"
    exclude "META-INF/LICENSE"
    exclude "META-INF/NOTICE"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    rename "(.+_at.cfg)", "META-INF/\$1"
    
    doLast {
        def versionFile = file("${buildDir}/resources/main/edneko.properties")
        versionFile.text = """version=${project.version}
mcversion=${project.minecraft.version}
"""
    }
}

task moveResources {
    dependsOn compileJava

    doLast {
        copy {
            from "${buildDir}/resources/main"
            into "${buildDir}/classes/java"
        }

        def refmap = file("${buildDir}/tmp/compileJava/liquidbounce.mixins.refmap.json")
        if (refmap.exists()) {
            copy {
                from refmap
                into "${buildDir}/classes/java"
            }
        }
    }
}

moveResources.dependsOn(processResources)
classes.dependsOn(moveResources)

jar {
    manifest.attributes(
            "FMLCorePlugin": "net.ccbluex.liquidbounce.injection.forge.MixinLoader",
            "FMLCorePluginContainsFMLMod": true,
            "ForceLoadAsMod": true,
            "MixinConfigs": "liquidbounce.forge.mixins.json",
            "ModSide": "CLIENT",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder": "0",
            "FMLAT": "liquidbounce_at.cfg"
    )

    enabled = false
}

mixin {
    disableRefMapWarning = true
    defaultObfuscationEnv searge
    add sourceSets.main, "liquidbounce.mixins.refmap.json"
}

reobf {
    shadowJar {
        mappingType = "SEARGE"
    }
}

reobfJar.enabled = false

shadowJar.finalizedBy(reobfShadowJar)

task packageReleaseZip(type: Zip) {
    group = "build"
    description = "Packages zip_include files and the built mod jar into a release zip."

    dependsOn reobfShadowJar

    archiveBaseName.set("${project.archives_base_name}")
    archiveExtension.set("zip")
    destinationDirectory.set(file("${buildDir}/libs"))

    doFirst {
        file("${buildDir}/libs").listFiles()?.each { candidate ->
            if (candidate.isFile() && candidate.name.endsWith(".zip")) {
                candidate.delete()
            }
        }
    }

    from("zip_include")

    from(shadowJar.archiveFile) {
        rename { "edneko.jar" }
    }
}

build.dependsOn packageReleaseZip

// ForgeGradle 2.x puts the packaged mod jar on runClient's classpath. This
// project's normal build jar is reobfuscated for Minecraft launchers, so it
// cannot be used in ForgeGradle's deobfuscated dev runtime. runClient still
// needs a jar very early, though, because FML loads command-line coremods
// before the normal source-set classpath is usable. Build a small, non-reobf
// development jar for that launch path and replace the production jar with it.
task runClientDevJar(type: Jar) {
    dependsOn classes

    archiveBaseName.set(project.archives_base_name)
    archiveClassifier.set("dev")
    destinationDirectory.set(file("${buildDir}/devRun"))

    from sourceSets.main.output

    manifest.attributes(
            "FMLCorePlugin": "net.ccbluex.liquidbounce.injection.forge.MixinLoader",
            "FMLCorePluginContainsFMLMod": true,
            "ForceLoadAsMod": true,
            "MixinConfigs": "liquidbounce.forge.mixins.json",
            "ModSide": "CLIENT",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder": "0",
            "FMLAT": "liquidbounce_at.cfg"
    )
}

gradle.projectsEvaluated {
    tasks.withType(JavaExec).matching { it.name == "runClient" }.all {
        dependsOn runClientDevJar

        doFirst {
            def packagedJarDir = file("${buildDir}/libs").canonicalFile
            def devJar = runClientDevJar.archiveFile.get().asFile.canonicalFile
            classpath = files(devJar) + sourceSets.main.runtimeClasspath + files(classpath.files.findAll { candidate ->
                def canonicalCandidate = candidate.canonicalFile
                canonicalCandidate != devJar && !canonicalCandidate.path.startsWith(packagedJarDir.path)
            })
        }
    }
}
