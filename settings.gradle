pluginManagement {
    repositories {
        mavenLocal()
        // 国内 jitpack 镜像（优先，避免官方 jitpack 慢/401）
        maven {
            url = "https://jitpack-ccbluex.bestmc.cn/"
            content { includeGroupByRegex "com\\.github\\.(ccbluex|xcfrg)\\..*" }
        }
        maven {
            url = "https://mirrors.cloud.tencent.com/nexus/repository/jitpack/"
            content { includeGroupByRegex "com\\.github\\.(ccbluex|xcfrg)\\..*" }
        }
        maven {
            url = "https://maven.aliyun.com/repository/jitpack/"
            content { includeGroupByRegex "com\\.github\\.(ccbluex|xcfrg)\\..*" }
        }
        maven {
            url = "https://jitpack.io/"
            content { includeGroupByRegex "com\\.github\\.(ccbluex|xcfrg)\\..*" }
        }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://files.mcdn.lifehi.com/forge/" }
        maven {
            url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/"
            content { excludeGroupByRegex "com\\.github\\..*" }
        }
        maven {
            url = "https://maven.aliyun.com/nexus/content/groups/public/"
            content { excludeGroupByRegex "com\\.github\\..*" }
        }
        maven {
            url = "https://repo.huaweicloud.com/repository/maven/"
            content { excludeGroupByRegex "com\\.github\\..*" }
        }
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case "net.minecraftforge.gradle.forge":
                    useModule("com.github.ccbluex:ForgeGradle:${forgegradle_version}")
                    break
                case "org.spongepowered.mixin":
                    useModule("com.github.xcfrg:mixingradle:${mixingradle_version}")
                    break
            }
        }
    }
    plugins {
        id "org.jetbrains.kotlin.jvm" version kotlin_version
    }
}

rootProject.name = 'LiquidBounce'